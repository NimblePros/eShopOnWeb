name: eShopOnWeb Build and Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    env:
      SOLUTION_FILE: ./eShopOnWeb.slnx

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: '11.0.x'

    - name: Build with dotnet
      run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release

      # Browsers install to the shared Playwright cache, so the Release build's script works for the Debug test run.
    - name: Install Playwright browsers
      run: pwsh tests/EndToEndTests/bin/Release/net11.0/playwright.ps1 install --with-deps chromium

      # The EndToEnd tests start the Web app on https://localhost:5001.
    - name: Create HTTPS development certificate
      run: dotnet dev-certs https

      # Tests run on Microsoft.Testing.Platform (see "test" in global.json).
      # Each test project references coverlet.MTP, which writes one Cobertura report per project.
      # A test project that runs zero tests exits with code 8, which fails this step. That catches
      # silent discovery failures (see issue #281), so don't add --ignore-exit-code 8 here.
    - name: Test with dotnet
      run: dotnet test --solution ${{ env.SOLUTION_FILE }} --no-restore --coverlet --coverlet-output-format cobertura --results-directory coverage --results-directory-layout per-module

    - name: Code Coverage Summary Report
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: coverage/**/coverage.cobertura*.xml
        badge: true
        format: 'markdown'
        output: 'both'

    - name: Upload code coverage results artifact
      uses: actions/upload-artifact@v4
      if: success() || failure()
      with:
        name: code-coverage-results
        path: code-coverage-results.md
        retention-days: 1
    
    - name: Save the PR number in an artifact
      if: github.event_name == 'pull_request' && (success() || failure()) 
      shell: bash
      env:
        PR_NUMBER: ${{ github.event.number }}
      run: echo $PR_NUMBER > pr-number.txt
  
    - name: Upload the PR number
      uses: actions/upload-artifact@v4
      if: github.event_name == 'pull_request' &&  (success() || failure())
      with:
        name: pr-number
        path: ./pr-number.txt
        retention-days: 1
