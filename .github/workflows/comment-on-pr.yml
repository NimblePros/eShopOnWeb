name: Comment on the Pull Request

# Runs on `workflow_run`, in the base repository with a read-write token, so fork PRs get a
# coverage comment without the PR build itself having write access.
# See: https://securitylab.github.com/research/github-actions-preventing-pwn-requests/
# The shared workflow downloads artifacts from the triggering run only, checks the PR number
# against the run's head commit, and skips cancelled builds:
# https://github.com/NimblePros/NimblePros.GitHub.Workflows#comment-on-pull-request
on:
  workflow_run:
    workflows: ["eShopOnWeb Build and Test"]
    types:
      - completed

permissions:
  actions: read
  pull-requests: write

jobs:
  add-code-coverage-to-pr:
    uses: NimblePros/NimblePros.GitHub.Workflows/.github/workflows/comment-on-pr.yml@main
    with:
      code-coverage-artifact-name: code-coverage-results
      code-coverage-artifact-path: code-coverage-results.md
