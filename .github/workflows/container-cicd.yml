name: Build, Publish Docker Image and Deploy to Azure Web App (Container)

on:
  push:
    branches:
      - 'feature/**'
      - 'main'
      - 'develop'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: DotnetWebApp

jobs:
  install-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet packages
        run: dotnet restore eShopOnWeb.sln

      - name: Build solution
        run: dotnet build eShopOnWeb.sln --configuration Release --no-restore

      - name: Run tests
        id: test-run
        run: dotnet test eShopOnWeb.sln --configuration Release --no-build --verbosity minimal

  build:
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature')) ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')
    needs: install-dependencies
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.set-image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet packages
        run: dotnet restore eShopOnWeb.sln

      - name: Build solution
        run: dotnet build eShopOnWeb.sln --configuration Release --no-restore

      - name: Build Docker image
        id: build-image
        env:
          DOCKERHUB_REPO: ${{ secrets.DOCKERHUB_REPO }}
          TAG: ${{ github.sha }}
        run: |
          docker build -f src/Web/Dockerfile -t docker.io/${DOCKERHUB_REPO}:${TAG} .
          docker save -o image.tar docker.io/${DOCKERHUB_REPO}:${TAG}

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-tar
          path: image.tar

      - name: Set image output
        id: set-image
        run: |
          IMAGE=docker.io/${{ secrets.DOCKERHUB_REPO }}:${GITHUB_SHA}
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT

  scan:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      image: ${{ needs.build.outputs.image }}
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-tar

      - name: Load Docker image
        run: |
          docker load -i image.tar

      - name: Scan image with Trivy
        id: trivy-scan
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          echo "Scanning image ${IMAGE} with Trivy..."
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.32.2 image --exit-code 1 --severity CRITICAL,HIGH ${IMAGE}

      - name: Push Docker image to Docker Hub
        if: ${{ success() }}
        id: push-image
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
          docker push ${IMAGE}

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy image to Azure Web App (Container)
        env:
          IMAGE: ${{ needs.scan.outputs.image }}
          RG: ${{ secrets.RESOURCE_GROUP }}
          WEBAPP: ${{ secrets.WEBAPP_NAME }}
        run: |
          az webapp config container set --name ${WEBAPP} --resource-group ${RG} \
            --docker-custom-image-name ${IMAGE} \
            --docker-registry-server-url https://index.docker.io \
            --docker-registry-server-user ${{ secrets.DOCKERHUB_USERNAME }} \
            --docker-registry-server-password ${{ secrets.DOCKERHUB_TOKEN }}
          az webapp restart --name ${WEBAPP} --resource-group ${RG}

  # Optional: add a small notifications job or health-check after deploy if desired
